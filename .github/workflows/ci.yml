name: CI

permissions:
  contents: read

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-types:
    name: Build types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install
        working-directory: framework

      - name: Build types
        run: bun run build:types
        working-directory: framework

      - name: Typecheck
        run: bun run typecheck
        working-directory: framework

      - name: Run tests
        run: bun test
        working-directory: framework

  go-cli:
    name: Go CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          cache: false

      - name: Go vet and test
        shell: bash
        run: |
          go vet ./...
          go test -v ./...
        working-directory: cli
