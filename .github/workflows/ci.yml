name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-types:
    name: Build types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install
        working-directory: framework

      - name: Build types
        run: bun run build:types
        working-directory: framework

      - name: Typecheck
        run: bun run typecheck
        working-directory: framework
