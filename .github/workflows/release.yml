name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-cli:
    name: Build dex binary (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            goos: linux
            goarch: amd64
            ext: ''
          - target: linux-arm64
            goos: linux
            goarch: arm64
            ext: ''
          - target: darwin-x64
            goos: darwin
            goarch: amd64
            ext: ''
          - target: darwin-arm64
            goos: darwin
            goarch: arm64
            ext: ''
          - target: windows-x64
            goos: windows
            goarch: amd64
            ext: '.exe'

    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          cache: false

      - name: Build dex binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../dist
          TAG_VERSION="${GITHUB_REF#refs/tags/}"
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -trimpath -ldflags="-s -w -X main.Version=${TAG_VERSION}" -o ../dist/dex-${{ matrix.target }}${{ matrix.ext }} ./cmd/dex
        working-directory: cli

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: dex-${{ matrix.target }}${{ matrix.ext }}
          path: dist/dex-${{ matrix.target }}${{ matrix.ext }}

  build-templates:
    name: Build template tarballs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Create template tgz
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # For now we publish the starter as the SPA template.
          # CLI expects assets named dex-template-spa.tgz (and optionally dex-template-mpa.tgz).
          tar -czf dist/dex-template-spa.tgz -C templates starter

      - name: Generate template diff
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_TAG="${GITHUB_REF#refs/tags/}"
          PREV_TAG=$(git describe --tags --abbrev=0 "${CURRENT_TAG}^" 2>/dev/null || echo "")
          bun scripts/generate-template-diff.ts "${CURRENT_TAG}" "${PREV_TAG}"

      - name: Upload template artifact
        uses: actions/upload-artifact@v7
        with:
          name: dex-templates
          path: dist/*.tgz

      - name: Upload diff artifact
        uses: actions/upload-artifact@v7
        with:
          name: dex-diff
          path: dist/dex-diff-*.json

  build-types:
    name: Build types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install
        working-directory: framework

      - name: Build types
        run: bun run build:types
        working-directory: framework

  build-packages:
    name: Build package tarballs
    runs-on: ubuntu-latest
    needs: [build-types]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install
        working-directory: framework

      - name: Create package tgz
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../dist
          for pkg in core router server dev pie validation; do
            tar -czf "../dist/dex-package-${pkg}.tgz" -C packages "${pkg}"
          done
        working-directory: framework

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dex-packages
          path: dist/dex-package-*.tgz

  publish-release:
    name: Publish GitHub Release Assets
    needs: [build-cli, build-templates, build-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Flatten artifacts and generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          # binaries
          for d in dist/dex-*; do
            if [[ -d "$d" ]]; then
              f=$(find "$d" -maxdepth 1 -type f | head -n1 || true)
              if [[ -n "${f}" ]]; then
                cp "$f" "out/$(basename "$f")"
              fi
            fi
          done
          # templates
          if [[ -d dist/dex-templates ]]; then
            cp dist/dex-templates/*.tgz out/
          fi
          # packages
          if [[ -d dist/dex-packages ]]; then
            cp dist/dex-packages/*.tgz out/
          fi
          # diffs
          if [[ -d dist/dex-diff ]]; then
            cp dist/dex-diff/*.json out/
          fi
          # checksums
          (cd out && sha256sum * > SHA256SUMS)

      - name: Upload assets to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            out/*
