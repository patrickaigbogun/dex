name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-cli:
    name: Build dex binary (${{ matrix.target }})
    runs-on: ${{ matrix.runsOn }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runsOn: ubuntu-latest
            ext: ''
          - target: linux-arm64
            runsOn: ubuntu-latest
            ext: ''
          - target: darwin-x64
            runsOn: macos-latest
            ext: ''
          - target: darwin-arm64
            runsOn: macos-latest
            ext: ''
          - target: windows-x64
            runsOn: windows-latest
            ext: '.exe'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install
        working-directory: framework

      - name: Build dex binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../dist
          bun build --compile ./packages/cli/src/cli.ts --outfile ../dist/dex-${{ matrix.target }}${{ matrix.ext }} --target=bun-${{ matrix.target }}
        working-directory: framework

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: dex-${{ matrix.target }}${{ matrix.ext }}
          path: dist/dex-${{ matrix.target }}${{ matrix.ext }}

  build-templates:
    name: Build template tarballs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Create template tgz
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # For now we publish the starter as the SPA template.
          # CLI expects assets named dex-template-spa.tgz (and optionally dex-template-mpa.tgz).
          tar -czf dist/dex-template-spa.tgz -C templates starter

      - name: Generate template diff
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_TAG="${GITHUB_REF#refs/tags/}"
          PREV_TAG=$(git describe --tags --abbrev=0 "${CURRENT_TAG}^" 2>/dev/null || echo "")
          bun scripts/generate-template-diff.ts "${CURRENT_TAG}" "${PREV_TAG}"

      - name: Upload template artifact
        uses: actions/upload-artifact@v4
        with:
          name: dex-templates
          path: dist/*.tgz

      - name: Upload diff artifact
        uses: actions/upload-artifact@v4
        with:
          name: dex-diff
          path: dist/dex-diff-*.json

  build-packages:
    name: Build package tarballs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install
        working-directory: framework

      - name: Create package tgz
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../dist
          for pkg in router server dev pie; do
            tar -czf "../dist/dex-package-${pkg}.tgz" -C packages "${pkg}"
          done
        working-directory: framework

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dex-packages
          path: dist/dex-package-*.tgz

  publish-release:
    name: Publish GitHub Release Assets
    needs: [build-cli, build-templates, build-packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          # binaries
          for d in dist/dex-*; do
            if [[ -d "$d" ]]; then
              f=$(find "$d" -maxdepth 1 -type f | head -n1 || true)
              if [[ -n "${f}" ]]; then
                cp "$f" "out/$(basename "$f")"
              fi
            fi
          done
          # templates
          if [[ -d dist/dex-templates ]]; then
            cp dist/dex-templates/*.tgz out/
          fi
          # packages
          if [[ -d dist/dex-packages ]]; then
            cp dist/dex-packages/*.tgz out/
          fi
          # diffs
          if [[ -d dist/dex-diff ]]; then
            cp dist/dex-diff/*.json out/
          fi

      - name: Upload assets to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*
